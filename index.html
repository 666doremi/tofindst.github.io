<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tofindst | 路上的故事收集人</title>
    <style>
        :root {
            --bg-color: #F8F5F2;    /* 米白暖灰 */
            --main-text: #2A2A2A;   /* 炭黑 */
            --accent-color: #B88C6E; /* 焦糖淺棕 */
            --font-main: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-text);
            font-family: var(--font-main);
            line-height: 1.8;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
            padding: 0 20px;
        }

        /* 導覽列：非線性記憶碎片 */
        nav {
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(248, 245, 242, 0.9);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav a {
            text-decoration: none;
            color: var(--main-text);
            margin: 0 20px;
            font-size: 14px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        h1 {
            font-size: clamp(28px, 5vw, 42px);
            letter-spacing: 8px;
            margin-bottom: 20px;
            font-weight: 400;
            text-transform: lowercase;
        }

        /* 核心敘事：17px 加粗放大 */
        .hero-text {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--main-text);
        }

        .tagline {
            font-size: 13px;
            color: #999;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }

        @keyframes tofindFadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            opacity: 0;
            animation: tofindFadeUp 1.2s ease forwards;
        }
